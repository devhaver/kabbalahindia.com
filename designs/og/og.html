<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "DM Serif Display";
        src: url("fonts/DMSerifDisplay-Regular.ttf");
      }
      @font-face {
        font-family: "Tiro Devanagari Hindi";
        src: url("fonts/TiroDevanagariHindi-Regular.ttf");
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/Inter.ttf");
        font-weight: 100 900;
      }

      * {
        margin: 0;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #dce6f3;
      }

      /* The hero landscape, shifted right and down so the ridges sit behind
         the right half and the sky stays clear for the text. The gradient
         repeats the SVG's own sky so the strip left of it matches. */
      .scene {
        position: absolute;
        top: -190px;
        left: 0;
        width: 1600px;
        height: 820px;
        background: linear-gradient(#eef3f9, #d8e3f2 55%, #c3d3e9);
      }

      .scene img {
        position: absolute;
        top: 0;
        left: 200px;
        width: 1440px;
        height: 820px;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 320px);
        mask-image: linear-gradient(to right, transparent, #000 320px);
      }

      .copy {
        position: absolute;
        top: 128px;
        left: 120px;
        width: 700px;
      }

      .rule {
        width: 56px;
        height: 4px;
        margin-bottom: 30px;
        border-radius: 2px;
        background: #e27a2e;
      }

      h1 {
        font: 400 76px/1.08 "DM Serif Display", serif;
        color: #1a1a4d;
      }

      .hi {
        margin-top: 22px;
        font: 400 44px/1.4 "Tiro Devanagari Hindi", serif;
        color: #9d4f17;
      }

      .meta {
        margin-top: 26px;
        font: 500 28px/1.3 "Inter", sans-serif;
        letter-spacing: 0.04em;
        color: #38405a;
      }
    </style>
  </head>
  <body>
    <div class="scene"><img src="../landscape/desktop.svg" alt="" /></div>
    <div class="copy">
      <div class="rule"></div>
      <h1>Kabbalah Academy India</h1>
      <p class="hi" lang="hi">असली कबाला, अब भारत में।</p>
      <p class="meta">Free · Online · Live in English</p>
    </div>
  </body>
</html>
